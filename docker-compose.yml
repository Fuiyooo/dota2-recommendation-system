services:
  db:
    image: postgres:17-alpine
    container_name: dota2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dota2
    ports:
      - "5433:5432"
    volumes:
      - dota2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dota2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dota2-pgdata:
